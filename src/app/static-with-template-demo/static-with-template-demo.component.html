
<div class='table-responsive'>
  <ngx-table [tableData]=data [columns]=columns [config]="config" (tableChange)="tableChange($event)" [component]="appComponent">
      <ng-template #rows let-item="dataRow" let-i="index" let-component="component">
          <td>{{item.id }}</td>
         <td>{{item.name }}</td>
         <td>{{item.email }}</td>
         <td>{{item.age}}</td>
         <td style='cursor: pointer;' title="open console to see message" (click)="component.logMe(item.phone)">{{item.phone}}</td>
         <td><a href="https://en.wikipedia.org/wiki/{{item.city}}">{{item.city}}</a></td>
         <td>{{item.rank}}</td>
         <td>{{item.donation | currency}}</td>
       </ng-template>
  </ngx-table>
</div>
  
<div class='container'>
  <tabset>
      <tab heading="Module" id="tab1">
          <pre><code class="lang-typescript">{{moduleCode}}</code></pre>
      </tab>
      <tab heading="Template" id="tab2">
          <pre><code class="language-markup">{{templateCode}}</code></pre>
      </tab>
      <tab heading="Component" id="tab3">
          <pre><code class="lang-typescript">{{componentCode}}</code></pre>
      </tab>
  </tabset>
</div>
